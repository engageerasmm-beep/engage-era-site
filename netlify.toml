# Netlify config for eesmm.com
[build]
  publish = "public"

# Keep private pages out of search engines
[[headers]]
  for = "/results/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/thanks/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Assets. WebP variants have a content hash in the name, and CSS/JS are loaded
# with ?v=<hash>, so they can be cached for a year. Other images keep a week,
# since a story's image can be replaced under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/w/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/site.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
